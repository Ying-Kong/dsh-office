[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-office-core"
version = "0.1.0"
description = "Deterministic OOXML template filling: fact extraction, declarative ops, verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsh-office contributors" }]
keywords = ["docx", "ooxml", "template", "agent", "dsh", "deterministic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "python-docx>=1.1.0",
  "click>=8.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/Ying-Kong/dsh-office"
Spec = "https://github.com/Ying-Kong/dsh-office/tree/main/spec"

[project.scripts]
dsh-office = "office_core.cli:main"

[tool.setuptools]
packages = ["office_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-work"

[tool.coverage.run]
source = ["office_core"]
